version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: carbon
      POSTGRES_PASSWORD: carbon
      POSTGRES_DB: carbon_polygon
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/init_db:/docker-entrypoint-initdb.d:ro

volumes:
  db_data:
